<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#161f30" />
    </linearGradient>

    <!-- Honeycomb Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="60%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Hex Shield Neon Rim -->
    <linearGradient id="shieldRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.9" />
    </linearGradient>

    <!-- Wing Gradient -->
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.25" />
    </linearGradient>

    <!-- Allowed Traffic Gradient (Emerald) -->
    <linearGradient id="allowedFlow" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="1" />
      <stop offset="100%" stop-color="#6ee7b7" stop-opacity="1" />
    </linearGradient>

    <!-- Dropped Traffic Gradient (Ruby) -->
    <linearGradient id="droppedFlow" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#f87171" stop-opacity="0.2" />
      <stop offset="70%" stop-color="#ef4444" stop-opacity="1" />
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)" />

  <!-- Outer Hexagonal Honeycomb Shield Frame -->
  <polygon points="256,44 428,143 428,342 256,441 84,342 84,143" 
           fill="#111827" 
           stroke="url(#shieldRim)" 
           stroke-width="7" 
           stroke-linejoin="round"
           filter="url(#softGlow)" />

  <!-- Inner Honeycomb Grid Texture -->
  <g stroke="#1f2937" stroke-width="2" fill="none" opacity="0.6">
    <polygon points="256,84 394,164 394,323 256,403 118,323 118,164" />
    <line x1="84" y1="143" x2="118" y2="164" />
    <line x1="428" y1="143" x2="394" y2="164" />
    <line x1="428" y1="342" x2="394" y2="323" />
    <line x1="84" y1="342" x2="118" y2="323" />
    <line x1="256" y1="44" x2="256" y2="84" />
    <line x1="256" y1="441" x2="256" y2="403" />
  </g>

  <!-- Network Flow Paths Behind the Guard -->
  <!-- 1. Allowed Flow (Top-left through bottom-right) -->
  <path d="M 50,210 Q 150,210 210,256 T 462,256" 
        fill="none" 
        stroke="url(#allowedFlow)" 
        stroke-width="5" 
        stroke-dasharray="10 6" 
        filter="url(#softGlow)" />
  <circle cx="462" cy="256" r="6" fill="#10b981" filter="url(#neonGlow)" />
  <polygon points="468,256 454,250 454,262" fill="#10b981" />

  <!-- 2. Dropped Flow (Bottom-left deflected by shield) -->
  <path d="M 50,305 Q 140,305 180,290" 
        fill="none" 
        stroke="url(#droppedFlow)" 
        stroke-width="5" 
        filter="url(#softGlow)" />
  <!-- Drop Collision / Deflection Point -->
  <g transform="translate(180, 290)">
    <circle cx="0" cy="0" r="10" fill="#ef4444" opacity="0.25" />
    <circle cx="0" cy="0" r="5" fill="#ef4444" filter="url(#softGlow)" />
    <!-- Small Deflection Spark Rays -->
    <line x1="-8" y1="-8" x2="-14" y2="-14" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" />
    <line x1="-8" y1="8" x2="-14" y2="14" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" />
    <line x1="-10" y1="0" x2="-17" y2="0" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Guardbee Central Mascot / Icon Silhouette -->
  <!-- Left Wing -->
  <ellipse cx="206" cy="205" rx="55" ry="32" 
           transform="rotate(-38 206 205)" 
           fill="url(#wingGrad)" 
           stroke="#7dd3fc" 
           stroke-width="2.5" />
  <!-- Left Wing Inner Vein -->
  <path d="M 175,225 Q 210,205 235,195" fill="none" stroke="#e0f2fe" stroke-width="1.5" opacity="0.7" />

  <!-- Right Wing -->
  <ellipse cx="306" cy="205" rx="55" ry="32" 
           transform="rotate(38 306 205)" 
           fill="url(#wingGrad)" 
           stroke="#7dd3fc" 
           stroke-width="2.5" />
  <!-- Right Wing Inner Vein -->
  <path d="M 337,225 Q 302,205 277,195" fill="none" stroke="#e0f2fe" stroke-width="1.5" opacity="0.7" />

  <!-- Antennae with Scanner Nodes -->
  <!-- Left Antenna -->
  <path d="M 238,185 Q 220,130 188,122" 
        fill="none" 
        stroke="#f59e0b" 
        stroke-width="4.5" 
        stroke-linecap="round" />
  <circle cx="188" cy="122" r="7.5" fill="#38bdf8" filter="url(#neonGlow)" />
  <circle cx="188" cy="122" r="3.5" fill="#ffffff" />

  <!-- Right Antenna -->
  <path d="M 274,185 Q 292,130 324,122" 
        fill="none" 
        stroke="#f59e0b" 
        stroke-width="4.5" 
        stroke-linecap="round" />
  <circle cx="324" cy="122" r="7.5" fill="#10b981" filter="url(#neonGlow)" />
  <circle cx="324" cy="122" r="3.5" fill="#ffffff" />

  <!-- Bee Body (Layered Torso & Armor Stripes) -->
  <g filter="url(#softGlow)">
    <!-- Base Body Shape -->
    <path d="M 256,170 C 298,170 322,205 322,265 C 322,325 285,368 256,388 C 227,368 190,325 190,265 C 190,205 214,170 256,170 Z" 
          fill="#111827" />

    <!-- Bee Head / Visor -->
    <path d="M 226,192 C 226,172 239,158 256,158 C 273,158 286,172 286,192 Z" 
          fill="url(#goldGrad)" />
    <!-- Visor Glass (HUD) -->
    <rect x="232" y="180" width="48" height="15" rx="7.5" fill="#0f172a" />
    <rect x="235" y="182" width="42" height="11" rx="5.5" fill="#38bdf8" opacity="0.9" filter="url(#softGlow)" />

    <!-- Golden Honeycomb Stripes -->
    <!-- Stripe 1 -->
    <path d="M 197,222 C 215,230 297,230 315,222 C 319,234 321,246 321,254 C 295,263 217,263 191,254 C 191,246 193,234 197,222 Z" 
          fill="url(#goldGrad)" />

    <!-- Stripe 2 -->
    <path d="M 194,275 C 218,285 294,285 318,275 C 314,292 305,310 295,322 C 275,327 237,327 217,322 C 207,310 198,292 194,275 Z" 
          fill="url(#goldGrad)" />

    <!-- Stripe 3 (Stinger Base) -->
    <path d="M 228,348 C 242,354 270,354 284,348 C 276,362 265,372 256,378 C 247,372 236,362 228,348 Z" 
          fill="url(#goldGrad)" />

    <!-- Stinger / Ground Pin (Security Anchor) -->
    <polygon points="256,396 250,382 262,382" fill="#f59e0b" />
  </g>

  <!-- Central Crest / Badge on Bee Chest (Verdict Emblem) -->
  <circle cx="256" cy="242" r="14" fill="#0b0f19" stroke="#f59e0b" stroke-width="2.5" />
  <!-- Checkmark / Flow Symbol inside Badge -->
  <path d="M 250,242 L 254,246 L 263,237" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Brand Typography -->
  <text x="256" y="476" 
        text-anchor="middle" 
        fill="#f3f4f6" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="28" 
        font-weight="800" 
        letter-spacing="4">GUARDBEE</text>
</svg>
