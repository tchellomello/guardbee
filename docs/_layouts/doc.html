<!doctype html>
<html lang="en">
<head>

<title>{{ page.title }} — GuardBee Docs</title>
<meta name="description" content="{{ page.description | default: 'GuardBee documentation' }}">
<link rel="icon" type="image/svg+xml" href="../branding/guardbee-logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>

<nav class="nav">
  <div class="nav-inner">

  </div>
</nav>

<main class="wrap docs-page">
  <nav class="doc-nav">
    <a href="commands.html"{% if page.url contains 'commands' %} class="active"{% endif %}>Commands</a>
