# CiliumClusterwideNetworkPolicy: the corrected version of
# examples/ccnp-coredns-dns-only.yaml. Live-validated with
# "verdict --all-namespaces --last 15000" against this cluster: DNS (53),
# kubelet's liveness/readiness probes (8080/8181, reserved:host), and
# Prometheus's metrics scrape (observability/prometheus-toca-0, TCP/9153) all
# come back UNCHANGED — every real flow that currently reaches CoreDNS still
# reaches it under this policy.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: coredns-merge-ready
spec:
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: kube-system
      k8s:k8s-app: kube-dns
  ingress:
    - fromEntities:
        - cluster
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
            - port: "8181"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: prometheus
            io.kubernetes.pod.namespace: observability
      toPorts:
        - ports:
            - port: "9153"
              protocol: TCP
