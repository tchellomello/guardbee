# Deliberately broken: same selectors as homeassistant-allow-mosquitto.yaml
# but the wrong port (9999 instead of 1883). This is the negative-test
# counterpart — once this policy selects homeassistant, every port not
# explicitly allowed (including the real mosquitto 1883 traffic) flips from
# default-allow to default-deny. Expect NEWLY_DROPPED for that flow.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: homeassistant-wrong-port
  namespace: homeassistant
spec:
  endpointSelector:
    matchLabels:
      app: homeassistant
  ingress:
    - fromEndpoints:
        - matchLabels:
            app: mosquitto
            io.kubernetes.pod.namespace: mosquitto
      toPorts:
        - ports:
            - port: "9999"
              protocol: TCP
