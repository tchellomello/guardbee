# Candidate that correctly matches real traffic: mosquitto -> homeassistant
# on TCP/1883, confirmed live via CiliumEndpoint homeassistant-0 (identity
# 51702, label k8s:app=homeassistant) and the "flows -n homeassistant" smoke
# test. Expect this to come back UNCHANGED for the 1883 flow.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: homeassistant-allow-mosquitto
  namespace: homeassistant
spec:
  endpointSelector:
    matchLabels:
      app: homeassistant
  ingress:
    - fromEndpoints:
        - matchLabels:
            app: mosquitto
            io.kubernetes.pod.namespace: mosquitto
      toPorts:
        - ports:
            - port: "1883"
              protocol: TCP
