# Read-only identity for the guardbee CLI
apiVersion: v1
kind: ServiceAccount
metadata:
  name: guardbee
  namespace: guardbee
---
apiVersion: v1
kind: Secret
metadata:
  name: guardbee-token
  namespace: guardbee
  annotations:
    kubernetes.io/service-account.name: guardbee
type: kubernetes.io/service-account-token
---
# Cluster-wide: the CLI must see policy and identity state across every namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: guardbee-read
rules:
  - apiGroups: ["cilium.io"]
    resources:
      - ciliumnetworkpolicies
      - ciliumclusterwidenetworkpolicies
      - ciliumidentities
      - ciliumendpoints
    # "get" here also covers GET /api/policies/edit (ui.go's
    # handlePolicyForEdit, the Policies tab's "Edit in Policy Editor") —
    # fetching one named CNP/CCNP by name is still the "get" verb, same as
    # the list used by the Policies tab itself; no RBAC change was needed
    # when that feature was added, this just makes it explicit.
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
  # Connectivity simulation must establish whether the baseline includes
  # Kubernetes NetworkPolicies it cannot model. A denied inventory read is
  # inconclusive, never evidence that none exist. No policy writes are needed.
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["list"]
  # Connectivity tests against a Service name (db.app.svc) correlate Hubble
  # flows through the Service's ClusterIPs and backend addresses: socket-level
  # load balancing rewrites the ClusterIP before Hubble sees the packet. A
  # denied read leaves such a test inconclusive, never guessed. "list" only
  # feeds the connectivity test's Host suggestions (Service names and
  # ports, GET /api/services); without it the UI suggests Services seen in
  # flows instead.
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: guardbee-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: guardbee-read
subjects:
  - kind: ServiceAccount
    name: guardbee
    namespace: guardbee
---
# Scoped to cilium-system only: lets the CLI port-forward to hubble-relay. RBAC for
# `kubectl port-forward svc/hubble-relay` resolves to a backing pod client-side, so it
# needs get/list on pods (to resolve the Service's selector) plus create on
# pods/portforward - there is no way to further scope this to one Service by label.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: guardbee-hubble-relay
  namespace: cilium-system
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/portforward"]
    verbs: ["create"]
  # verdict reads only Hubble's redaction settings from this one ConfigMap,
  # and only when it judges HTTP requests: a redacted URL query would make a
  # path verdict a guess (httpverdict.go). Without it, HTTP requests are
  # reported as not judged rather than guessed.
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["cilium-config"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: guardbee-hubble-relay
  namespace: cilium-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: guardbee-hubble-relay
subjects:
  - kind: ServiceAccount
    name: guardbee
    namespace: guardbee
