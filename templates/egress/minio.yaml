# Egress rule preset: only spec.egress[0] and spec.description are used by
# the UI (see templates.go's loadTemplates). metadata.name/endpointSelector
# are placeholders so this stays valid, loadable CiliumNetworkPolicy YAML.
# No namespace is baked in here — add one via the rule editor's peer picker
# once you've loaded this preset, to match where MinIO actually runs.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: egress-rule-preset-minio
  annotations:
    policy-simulator.cilium.io/display-name: "MinIO / S3"
spec:
  description: "Allow outbound to a MinIO/S3-compatible object store (port 9000) — set the peer's namespace to match your deployment"
  endpointSelector:
    matchLabels: {}
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: "minio"
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
