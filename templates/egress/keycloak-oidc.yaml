# Egress rule preset: only spec.egress[0] and spec.description are used by
# the UI (see templates.go's loadTemplates). metadata.name/endpointSelector
# are placeholders so this stays valid, loadable CiliumNetworkPolicy YAML.
# No namespace is baked in here — add one via the rule editor's peer picker
# once you've loaded this preset, to match where Keycloak actually runs.
#
# Pairs with ingress/keycloak-oidc.yaml (Keycloak's side of the same
# connection) — this one is for the relying-party app's own candidate
# policy.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: egress-rule-preset-keycloak-oidc
  annotations:
    policy-simulator.cilium.io/display-name: "Keycloak (OIDC)"
spec:
  description: "Allow outbound OIDC/SSO token exchange to Keycloak (port 8080) — set the peer's namespace to match your deployment"
  endpointSelector:
    matchLabels: {}
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: "keycloak"
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
