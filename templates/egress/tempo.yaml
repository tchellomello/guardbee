# Egress rule preset: only spec.egress[0] and spec.description are used by
# the UI (see templates.go's loadTemplates). metadata.name/endpointSelector
# are placeholders so this stays valid, loadable CiliumNetworkPolicy YAML.
# No namespace is baked in here — add one via the rule editor's peer picker
# once you've loaded this preset, to match where Tempo actually runs.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: egress-rule-preset-tempo
  annotations:
    policy-simulator.cilium.io/display-name: "Tempo (OTLP tracing)"
spec:
  description: "Allow outbound OTLP trace export to Tempo (gRPC 4317 + HTTP 4318) — set the peer's namespace to match your deployment"
  endpointSelector:
    matchLabels: {}
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: "tempo"
      toPorts:
        - ports:
            - port: "4317"
              protocol: TCP
            - port: "4318"
              protocol: TCP
