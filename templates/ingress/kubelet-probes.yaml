# Ingress rule preset: only spec.ingress[0] and spec.description are used by
# the UI (see templates.go's loadTemplates). metadata.name/endpointSelector
# are placeholders so this stays valid, loadable CiliumNetworkPolicy YAML.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ingress-rule-preset-kubelet-probes
  annotations:
    policy-simulator.cilium.io/display-name: "Kubelet health probes"
spec:
  description: "Allow liveness/readiness/startup probes from the node's kubelet (any port) — probes originate from the host, not a pod, and get silently blocked by default-deny otherwise"
  endpointSelector:
    matchLabels: {}
  ingress:
    - fromEntities:
        - host
