# Ingress rule preset: only spec.ingress[0] and spec.description are used by
# the UI (see templates.go's loadTemplates). metadata.name/endpointSelector
# are placeholders so this stays valid, loadable CiliumNetworkPolicy YAML.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ingress-rule-preset-same-namespace
  annotations:
    policy-simulator.cilium.io/display-name: "Same-namespace only"
spec:
  description: "Allow ingress only from other pods in the same namespace as the target (any port) — narrower than Cluster-internal only"
  endpointSelector:
    matchLabels: {}
  ingress:
    - fromEndpoints:
        - matchLabels: {}
