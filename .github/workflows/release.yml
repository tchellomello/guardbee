name: Release

# Fires when a GitHub Release is published (manually, via `gh release
# create`, or via the create-github-release skill) — not on every tag push,
# so a tag can exist without triggering a build.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    # Skip non-version asset releases (e.g. docs-media) so hosting walkthrough
    # videos as release assets never triggers binary builds.
    if: startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # softprops/action-gh-release needs to upload assets to the release
      id-token: write # attest-build-provenance: OIDC token for the Sigstore signing cert
      attestations: write # attest-build-provenance: store the attestation on the repo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs the exact Go version pinned in mise.toml, so CI never drifts
      # from what `mise run build` uses locally. Node is deliberately not
      # pinned via mise (see mise.toml's own comment on this) — setup-node
      # below handles it instead.
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      # Frontend is platform-independent — built once, embedded into every
      # GOOS/GOARCH binary below via go:embed.
      - name: Build frontend
        run: mise run ui-build

      # All four targets cross-compile cleanly with CGO_ENABLED=0 (verified
      # locally — none of the embedded Cilium packages pull in cgo), so a
      # single ubuntu-latest runner builds every target; no macOS runner
      # needed just to produce a macOS binary.
      - name: Cross-compile release binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          name=$(sed -n 's/.*const binName = "\(.*\)"/\1/p' globals.go)
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            out="${name}-${goos}-${goarch}"
            echo "Building ${out}..."
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build -ldflags "-X main.version=${VERSION}" -o "$out" .
            # completions/ is generated from globals.go and committed
            # (mise run completions), so the release ships exactly what
            # the repo and the Nix package install.
            tar -czf "dist/${name}_${VERSION}_${goos}_${goarch}.tar.gz" "$out" README.md LICENSE completions
            rm "$out"
          done
          ( cd dist && sha256sum ./*.tar.gz > SHA256SUMS )

      # Signed SLSA provenance for every tarball, so a user can check one
      # was built by this workflow from this repo:
      # gh attestation verify <tarball> --repo tchellomello/guardbee
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      - name: Upload release artifacts
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
