name: CI

# Runs on every PR (any branch) and on pushes to main — not on pushes to a
# branch that already has an open PR, which would otherwise double-run this
# for the same commit under both events.
on:
  push:
    branches: [main]
  pull_request:

# Least privilege: no job writes to the repo. upload-artifact authenticates
# with the runner's own artifact token, not GITHUB_TOKEN, so it needs nothing.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Same toolchain setup as release.yml: the exact Go version pinned in
      # mise.toml, so CI never drifts from what `mise run check` uses
      # locally. Node is deliberately not pinned via mise (see mise.toml's
      # own comment on this) — setup-node below handles it instead.
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      # build + vet + test, in that order — go build, go vet, go test, and
      # (via the "test" task's "ui-test" dependency) the frontend's vitest
      # suite. The one task that matches what a contributor runs locally
      # before pushing, so a passing local `mise run check` means CI passes
      # too.
      - name: mise run check
        run: mise run check

      # Fails the PR if Go or UI unit coverage drops below
      # coverage-baseline.json (scripts/coverage.sh). A ratchet: it only
      # has to never go down; raise it with `mise run coverage -- --update`.
      - name: coverage ratchet
        run: mise run coverage

  # The UI end to end, in a real browser: the built binary serving the
  # embedded production UI, cluster endpoints mocked (ui/e2e). Unit tests
  # can't see the class of bug this exists for — focus moving mid-keystroke,
  # a button turning into a submit button mid-click, a layout pushing a
  # phone screen sideways — every one of which reached a PR before.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Install Playwright's Chromium
        working-directory: ui
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: mise run e2e
        run: mise run e2e

      # Traces and failure screenshots: the only way to see what the
      # browser saw on a runner nobody can look at.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            ui/playwright-report
            ui/test-results
          retention-days: 7

  # The flake users install from (nix/package.nix). Its two dependency
  # hashes go stale on any go.sum or ui/package-lock.json change, and a
  # stale hash only shows up as a failed `nixos-rebuild` for every user
  # after merge — so it fails the PR here instead, naming the fix. Make
  # this a required check in branch protection: a stale hash that merges
  # anyway is exactly the failure this job exists to stop.
  nix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5

      - name: nix build
        run: |
          if ! nix build .#guardbee -L; then
            echo "::error::nix build failed. If it's a hash mismatch, run 'mise run nix-hashes' and commit nix/package.nix."
            exit 1
          fi

      - name: Smoke-test the built binary
        run: |
          ./result/bin/guardbee version --client
          ./result/bin/guardbee version --client | grep -q "cilium engine"
          test -f result/share/bash-completion/completions/guardbee.bash

  # End-to-end: the built binary against a real Cilium (lab-up.sh's
  # CILIUM_VERSION, which pin_test.go keeps equal to go.mod's pin) in a
  # disposable kind cluster, asserting the lab guide's known verdicts —
  # see lab/scripts/lab-validate.sh. This is what catches a Cilium bump
  # whose embedded pkg/policy still compiles and passes unit tests but
  # judges real Hubble flows differently. Runs after "check" so a broken
  # build fails fast without paying for a cluster.
  lab:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      # helm and kubectl ship with ubuntu-latest; kind doesn't. install_only:
      # lab-up.sh creates the cluster itself, with the lab's own kind-config
      # (no default CNI, so Cilium can own pod networking).
      - uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          install_only: true

      - name: mise run lab-validate
        run: mise run lab-validate
