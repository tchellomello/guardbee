# The corrected version of looks-correct.yaml: same app rule, plus the
# two ingress paths that candidate silently broke — the Prometheus scrape
# of the postgres-exporter sidecar, and kubelet's own TCP health probe
# (reserved:host) on the same pod.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: postgres-allow-webapp
  namespace: postgres
spec:
  endpointSelector:
    matchLabels:
      app: postgres
  ingress:
    - fromEndpoints:
        - matchLabels:
            app: webapp
            io.kubernetes.pod.namespace: webapp
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app: prometheus
            io.kubernetes.pod.namespace: observability
      toPorts:
        - ports:
            - port: "9187"
              protocol: TCP
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
