# The postgres-exporter runs as a sidecar in the same Pod as postgres,
# not a separate Deployment — deliberately. That makes it share postgres's
# CiliumEndpoint/identity (app: postgres), so a CNP selecting that one
# identity has to account for BOTH :5432 (the app's traffic) and :9187
# (the exporter's) on the SAME destination. That's exactly the shape of
# the real regression this lab reproduces: one endpoint, multiple ingress
# ports, easy to only remember one of them.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_PASSWORD
              value: "guardbee-lab" # disposable kind cluster only, never reused
            - name: POSTGRES_DB
              value: "guardbee"
          ports:
            - containerPort: 5432
          livenessProbe:
            tcpSocket:
              port: 5432
            periodSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 5432
            periodSeconds: 5
        - name: postgres-exporter
          image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
          env:
            - name: DATA_SOURCE_NAME
              value: "postgresql://postgres:guardbee-lab@localhost:5432/guardbee?sslmode=disable"
          ports:
            - containerPort: 9187
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: postgres
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
    - name: metrics
      port: 9187
      targetPort: 9187
