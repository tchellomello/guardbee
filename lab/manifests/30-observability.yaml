# Scrapes postgres-exporter every 5s — short enough that a small
# `--last` sample in the walkthrough reliably contains a few scrape
# flows, without needing --follow.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: observability
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
    scrape_configs:
      - job_name: postgres
        static_configs:
          - targets: ["postgres.postgres.svc.cluster.local:9187"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
          readinessProbe:
            tcpSocket:
              port: 9090
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: prometheus-config
