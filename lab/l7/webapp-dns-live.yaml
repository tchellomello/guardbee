# lab-validate's live DNS baseline: webapp's DNS goes through Cilium's DNS
# proxy (rules.dns, any name), so Hubble records each query and
# examples/webapp-dns-single-label-wildcard.yaml (same name, --replace-existing)
# can be judged per query.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: webapp-egress
  namespace: webapp
spec:
  endpointSelector:
    matchLabels:
      app: webapp
  egress:
    - toEndpoints:
        - matchLabels:
            k8s-app: kube-dns
            io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    - toEndpoints:
        - matchLabels:
            app: postgres
            io.kubernetes.pod.namespace: postgres
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
